<style>
/* Blog: compact two-column journal cards on desktop. */
@media (min-width: 769px) {
  .news-list {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 0.85rem !important;
    margin-bottom: 3.6rem !important;
  }

  .news-card {
    grid-template-columns: minmax(0, 1fr) 145px !important;
    min-height: 132px !important;
    border-radius: 10px !important;
  }

  .news-content {
    padding: 0.9rem 1rem !important;
  }

  .news-content h3 {
    font-size: 0.9em !important;
    line-height: 1.4 !important;
  }

  .news-meta {
    font-size: 0.78em !important;
  }
}

.blog-travel-section {
  margin: 4rem 0 1rem;
}

.blog-travel-title {
  margin: 0 0 0.72rem;
  color: #202327;
  font-size: 1.02em;
  font-weight: 500;
  line-height: 1.45;
}

.blog-travel-rule {
  width: 100%;
  margin: 0 0 1.7rem;
  border-top: 0.5px solid #e6eaf0;
}

.blog-travel-gallery {
  display: grid;
  grid-template-columns: 1fr;
  gap: 2.5rem;
  margin: 0;
}

.blog-travel-item {
  margin: 0;
  border: 0;
  border-radius: 16px;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.04);
}

.blog-travel-item img {
  display: block;
  width: 100%;
  height: auto;
  margin: 0;
  object-fit: cover;
  filter: grayscale(100%);
  transition: filter 0.4s ease;
}

.blog-travel-item:hover img {
  filter: grayscale(0%);
}

.blog-travel-item figcaption {
  margin: 0;
  padding: 1rem 1.5rem;
  color: #555;
  background: #fdfdfd;
  font-size: 0.84em;
  font-weight: 400;
  line-height: 1.6;
  text-align: right;
}

@media (max-width: 768px) {
  .blog-travel-section {
    margin-top: 3rem;
  }

  .blog-travel-rule {
    margin-bottom: 1.35rem;
  }

  .blog-travel-gallery {
    gap: 1.8rem;
  }

  .blog-travel-item {
    border-radius: 12px;
  }

  .blog-travel-item figcaption {
    padding: 0.8rem 1rem;
  }
}
</style>
