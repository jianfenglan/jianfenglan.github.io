<style>
/* Blog journal: a restrained vertical timeline on desktop. */
@media (min-width: 769px) {
  .page__content .news-list {
    position: relative;
    display: grid !important;
    grid-template-columns: 1fr !important;
    gap: 1.05rem !important;
    max-width: 820px !important;
    margin: 1.4rem auto 3.8rem !important;
    padding-left: 4.4rem !important;
  }

  .page__content .news-list::before {
    content: "";
    position: absolute;
    top: 0.55rem;
    bottom: 0.55rem;
    left: 1.37rem;
    width: 1px;
    background: #dce3ec;
  }

  .page__content .news-card {
    position: relative;
    display: grid !important;
    grid-template-columns: minmax(0, 1fr) 210px !important;
    width: 100% !important;
    min-height: 148px !important;
    margin: 0 !important;
    border-radius: 0 !important;
    overflow: visible !important;
  }

  .page__content .news-card::before {
    content: "";
    position: absolute;
    top: 50%;
    left: -3.35rem;
    width: 0.62rem;
    height: 0.62rem;
    border: 1px solid #8aa2bc;
    border-radius: 50%;
    background: #fff;
    transform: translateY(-50%);
    z-index: 2;
  }

  .page__content .news-content {
    padding: 1.05rem 1.25rem !important;
  }

  .page__content .news-content h3 {
    font-size: 0.94em !important;
    line-height: 1.45 !important;
  }

  .page__content .news-meta {
    font-size: 0.8em !important;
  }

  .page__content .news-image {
    overflow: hidden !important;
  }
}

.blog-travel-section {
  margin: 4.2rem 0 1rem;
}

.page__content .blog-travel-title {
  margin: 0 0 0.72rem !important;
  padding: 0 !important;
  border: 0 !important;
  color: #202327;
  font-size: 1.02em;
  font-weight: 300 !important;
  line-height: 1.45;
}

.blog-travel-rule {
  width: 100%;
  height: 0;
  margin: 0 0 1.7rem;
  border: 0;
  border-top: 0.5px solid #e6eaf0;
}

.blog-travel-gallery {
  display: grid;
  grid-template-columns: 1fr;
  gap: 2.5rem;
  margin: 0;
}

.page__content .blog-travel-item {
  margin: 0;
  border: 0;
  border-radius: 0 !important;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.04);
}

.page__content .blog-travel-item img {
  display: block;
  width: 100%;
  height: auto;
  margin: 0;
  border-radius: 0 !important;
  object-fit: cover;
  filter: grayscale(100%);
  transition: filter 0.4s ease;
}

.page__content .blog-travel-item:hover img {
  filter: grayscale(0%);
}

.page__content .blog-travel-item figcaption {
  margin: 0;
  padding: 1rem 1.5rem;
  color: #555;
  background: #fdfdfd;
  font-size: 0.84em;
  font-weight: 300 !important;
  line-height: 1.6;
  text-align: right;
}

@media (max-width: 768px) {
  .page__content .news-list {
    display: grid !important;
    grid-template-columns: 1fr !important;
    gap: 0.8rem !important;
    max-width: none !important;
    margin: 1.2rem 0 2.8rem !important;
    padding-left: 0 !important;
  }

  .page__content .news-list::before,
  .page__content .news-card::before {
    display: none !important;
  }

  .page__content .news-card {
    grid-template-columns: 1fr !important;
    min-height: 0 !important;
    overflow: hidden !important;
  }

  .blog-travel-section {
    margin-top: 3rem;
  }

  .blog-travel-rule {
    margin-bottom: 1.35rem;
  }

  .blog-travel-gallery {
    gap: 1.8rem;
  }

  .page__content .blog-travel-item,
  .page__content .blog-travel-item img {
    border-radius: 0 !important;
  }

  .page__content .blog-travel-item figcaption {
    padding: 0.8rem 1rem;
  }
}
</style>
